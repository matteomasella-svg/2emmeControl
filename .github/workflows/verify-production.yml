name: Verify 2M production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy
        run: sleep 35
      - name: Verify Airtable health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 4 --retry-delay 8 'https://2emmecontrol.netlify.app/api/2m-master?action=health')"
          echo "$body" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True; assert d.get('configured') is True; assert d.get('source') == 'airtable'; assert d.get('records_sampled',0) >= 1"
          echo 'Airtable health: OK'
      - name: Verify live property list
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 4 --retry-delay 8 'https://2emmecontrol.netlify.app/api/2m-master?action=properties')"
          echo "$body" | python -c "import json,sys; d=json.load(sys.stdin); names=[x.get('name','') for x in d.get('properties',[])]; assert d.get('ok') is True; assert len(names)==5; assert any('Heritage' in n for n in names); assert any('Masotto Terrace View' in n for n in names)"
          echo 'Airtable property list: OK'
      - name: Verify anagrafica UI
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --retry 4 --retry-delay 8 'https://2emmecontrol.netlify.app/anagrafica.html')"
          printf '%s' "$html" | grep -q '2M MultiProperty'
          printf '%s' "$html" | grep -q '/api/2m-master'
          if printf '%s' "$html" | grep -q 'masotto_db.js'; then echo 'Legacy masotto_db.js still loaded' >&2; exit 1; fi
          if printf '%s' "$html" | grep -q 'ms_core.js'; then echo 'Legacy ms_core.js still loaded' >&2; exit 1; fi
          echo 'Anagrafica UI: OK'
